<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tasirin (AI) — Jembatan Tasirin</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
         margin: 0; background: #fff; color: #0d0d0d; display: flex; flex-direction: column; }

  header { display: flex; align-items: center; justify-content: space-between;
           padding: 10px 16px; border-bottom: 1px solid #ececec; position: sticky; top: 0; background: #fff; }
  .judul { font-size: 16px; font-weight: 600; }
  .judul small { display: block; font-weight: 400; color: #6b6b6b; font-size: 12px; }
  #baru { border: 1px solid #d9d9d9; background: #fff; border-radius: 999px;
          padding: 7px 14px; font-size: 14px; cursor: pointer; }
  #baru:hover { background: #f4f4f4; }

  main { flex: 1; overflow-y: auto; }
  .kolom { max-width: 768px; margin: 0 auto; padding: 24px 16px 8px; }

  .kosong { text-align: center; margin-top: 12vh; }
  .kosong h1 { font-size: 28px; font-weight: 600; margin-bottom: 8px; }
  .kosong p { color: #6b6b6b; margin: 0 0 28px; }
  .saran { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .saran button { border: 1px solid #d9d9d9; background: #fff; border-radius: 999px;
                  padding: 8px 14px; font-size: 14px; color: #353740; cursor: pointer; }
  .saran button:hover { background: #f4f4f4; }

  .giliran { margin-bottom: 28px; }
  .user { display: flex; justify-content: flex-end; }
  .user .gelembung { background: #f4f4f4; border-radius: 24px; padding: 10px 16px;
                     max-width: 80%; white-space: pre-wrap; word-wrap: break-word; line-height: 1.55; }
  .ai { display: flex; gap: 12px; margin-top: 16px; }
  .ai .ava { flex: none; width: 28px; height: 28px; border-radius: 50%; background: #0d0d0d;
             color: #fff; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; margin-top: 2px; }
  .ai .isi { line-height: 1.65; white-space: pre-wrap; word-wrap: break-word; padding-top: 3px; }
  .nanya { color: #6b6b6b; font-size: 14px; display: flex; gap: 12px; margin-top: 16px; }
  .titik span { display: inline-block; width: 6px; height: 6px; margin-right: 3px; border-radius: 50%;
                background: #9b9b9b; animation: lompat 1.2s infinite; }
  .titik span:nth-child(2) { animation-delay: .15s; }
  .titik span:nth-child(3) { animation-delay: .3s; }
  @keyframes lompat { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-4px); } }

  footer { padding: 8px 16px 14px; }
  .bungkus { max-width: 768px; margin: 0 auto; }
  .kotak { display: flex; align-items: flex-end; gap: 8px; border: 1px solid #d9d9d9;
           border-radius: 26px; padding: 8px 8px 8px 18px; box-shadow: 0 2px 10px rgba(0,0,0,.05); }
  .kotak textarea { flex: 1; border: none; outline: none; resize: none; font: inherit;
                    max-height: 140px; padding: 8px 0; background: transparent; }
  #kirim { flex: none; width: 36px; height: 36px; border: none; border-radius: 50%;
           background: #0d0d0d; color: #fff; font-size: 18px; cursor: pointer; line-height: 1; }
  #kirim:disabled { background: #d9d9d9; cursor: default; }
  .catatan { text-align: center; color: #6b6b6b; font-size: 12px; margin-top: 10px; }
</style>
</head>
<body>

<header>
  <div class="judul">Tasirin (AI)<small>ai kloningan tasirin — bukan tasirin yang asli</small></div>
  <button id="baru" title="Mulai obrolan baru di peramban ini">＋ Obrolan baru</button>
</header>

<main id="layar">
  <div class="kolom" id="kolom"></div>
</main>

<footer>
  <div class="bungkus">
    <div class="kotak">
      <textarea id="pesan" rows="1" placeholder="Tulis pesan di sini..." maxlength="2000"></textarea>
      <button id="kirim" title="Kirim" disabled>↑</button>
    </div>
    <div class="catatan">ai ini perwakilan tasirin yang dibentuk dari cara berpikir dan tulisannya — jawabannya bisa salah, dan dia akan jujur bilang begitu.<br>ip sama perangkat kamu dicatat, biar ai-nya kenal kamu — yang bisa lihat cuma tasirin sama ai-nya.</div>
  </div>
</footer>

<script>
const kolom = document.getElementById("kolom");
const layar = document.getElementById("layar");
const kotakPesan = document.getElementById("pesan");
const tombolKirim = document.getElementById("kirim");

const el = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// daftar id utas milik pengunjung ini (tersimpan di peramban saja)
let ids = [];
try { ids = JSON.parse(localStorage.getItem("bridge_ids") || "[]"); } catch (e) { ids = []; }
const lama = localStorage.getItem("bridge_utas");
if (lama && !ids.includes(lama)) { ids.push(lama); simpanIds(); }
function simpanIds() { localStorage.setItem("bridge_ids", JSON.stringify(ids)); }

const utasCache = {};   // id -> data utas terakhir dari server

const SARAN = [
  "kamu siapa sih?",
  "gimana pandanganmu soal desentralisasi?",
  "kenapa kejujuran nomor satu buatmu?",
  "gimana cara belajar ai menurutmu?"
];

function gambar() {
  if (!ids.length) {
    kolom.innerHTML = `<div class="kosong">
      <h1>halo, mau nanya apa?</h1>
      <p>yang jawab ai kloningan tasirin. tanya aja kayak ngobrol biasa.</p>
      <div class="saran">${SARAN.map(s => `<button data-saran="${el(s)}">${el(s)}</button>`).join("")}</div>
    </div>`;
    kolom.querySelectorAll("[data-saran]").forEach(b =>
      b.addEventListener("click", () => { kotakPesan.value = b.dataset.saran; kirim(); }));
    return;
  }
  let html = "";
  for (const id of ids) {
    const u = utasCache[id];
    if (!u) continue;
    html += `<div class="giliran">
      <div class="user"><div class="gelembung">${el(u.isi)}</div></div>`;
    if (u.balasan && u.balasan.length) {
      for (const b of u.balasan) {
        html += `<div class="ai"><div class="ava">T</div><div class="isi">${el(b.isi)}</div></div>`;
      }
    } else {
      html += `<div class="nanya"><div class="ava" style="width:28px;height:28px;border-radius:50%;background:#0d0d0d;color:#fff;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;">T</div><div class="titik"><span></span><span></span><span></span></div></div>`;
    }
    html += `</div>`;
  }
  kolom.innerHTML = html;
  layar.scrollTop = layar.scrollHeight;
}

async function segarkan() {
  for (const id of ids) {
    try {
      const r = await fetch("/api/utas/" + id);
      if (r.ok) utasCache[id] = await r.json();
    } catch (e) { /* jaringan putus sesaat, coba lagi nanti */ }
  }
  gambar();
}

async function kirim() {
  const isi = kotakPesan.value.trim();
  if (!isi) return;
  kotakPesan.value = "";
  aturTombol();
  try {
    const r = await fetch("/api/pesan", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({dari: "", isi})
    });
    const d = await r.json();
    if (d.id) {
      ids.push(d.id);
      simpanIds();
      utasCache[d.id] = {id: d.id, isi, balasan: []};
      gambar();
      segarkan();
    }
  } catch (e) { /* server tak terjangkau */ }
}

function aturTombol() {
  tombolKirim.disabled = !kotakPesan.value.trim();
  kotakPesan.style.height = "auto";
  kotakPesan.style.height = Math.min(kotakPesan.scrollHeight, 140) + "px";
}

kotakPesan.addEventListener("input", aturTombol);
kotakPesan.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); kirim(); }
});
tombolKirim.addEventListener("click", kirim);
document.getElementById("baru").addEventListener("click", () => {
  ids = []; simpanIds();
  for (const k of Object.keys(utasCache)) delete utasCache[k];
  gambar();
});

gambar();
segarkan();
setInterval(segarkan, 3000);
</script>

</body>
</html>
