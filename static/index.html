<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tasirin (AI)</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, sans-serif;
         margin: 0; background: #e5ddd5; color: #111b21; display: flex; flex-direction: column; }

  /* ===== header ala WhatsApp ===== */
  header { display: flex; align-items: center; gap: 10px; background: #075e54; color: #fff;
           padding: 8px 12px; position: sticky; top: 0; z-index: 5; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
  .ava-profil { flex: none; width: 40px; height: 40px; border-radius: 50%; background: #25d366;
                color: #fff; font-size: 19px; font-weight: 600; display: flex; align-items: center; justify-content: center; }
  .siapa { flex: 1; min-width: 0; line-height: 1.25; }
  .siapa .nama { font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .siapa .status { font-size: 12.5px; color: #d9fdd3; opacity: .9; }
  #baru { flex: none; border: none; background: transparent; color: #fff; font-size: 20px;
          cursor: pointer; padding: 6px 8px; border-radius: 50%; }
  #baru:active { background: rgba(255,255,255,.15); }

  /* ===== area obrolan ===== */
  main { flex: 1; overflow-y: auto;
         background-color: #e5ddd5;
         background-image: radial-gradient(rgba(0,0,0,.055) 1px, transparent 1.4px);
         background-size: 22px 22px; }
  .kolom { max-width: 860px; margin: 0 auto; padding: 12px 10px 6px;
           display: flex; flex-direction: column; }

  .info { align-self: center; background: #fdf3c6; color: #54656f; font-size: 12.5px; line-height: 1.45;
          text-align: center; border-radius: 8px; padding: 8px 12px; max-width: 92%;
          box-shadow: 0 1px 1px rgba(0,0,0,.13); margin: 4px 0 12px; }
  .tanggal { align-self: center; background: #fff; color: #54656f; font-size: 12px; font-weight: 500;
             border-radius: 8px; padding: 5px 12px; box-shadow: 0 1px 1px rgba(0,0,0,.13); margin: 6px 0 10px; }

  .baris { display: flex; margin-bottom: 3px; }
  .baris.kanan { justify-content: flex-end; }
  .baris.kiri { justify-content: flex-start; }
  .gelembung { position: relative; max-width: 78%; border-radius: 8px; padding: 6px 8px 5px 9px;
               box-shadow: 0 1px 1px rgba(0,0,0,.13); line-height: 1.4; font-size: 14.5px;
               white-space: pre-wrap; word-wrap: break-word; overflow-wrap: anywhere; }
  .kanan .gelembung { background: #d9fdd3; border-top-right-radius: 0; }
  .kiri .gelembung { background: #fff; border-top-left-radius: 0; }
  .meta { float: right; display: flex; align-items: center; gap: 3px;
          margin: 10px 0 0 10px; font-size: 11px; color: #667781; user-select: none; }
  .centang { font-size: 12px; letter-spacing: -3px; margin-right: 3px; }
  .centang.baca { color: #53bdeb; }

  .mengetik { display: flex; align-items: center; gap: 4px; padding: 12px 14px; }
  .mengetik span { width: 8px; height: 8px; border-radius: 50%; background: #b6b6b6; animation: lompat 1.2s infinite; }
  .mengetik span:nth-child(2) { animation-delay: .15s; }
  .mengetik span:nth-child(3) { animation-delay: .3s; }
  @keyframes lompat { 0%, 60%, 100% { transform: translateY(0); opacity: .5; } 30% { transform: translateY(-4px); opacity: 1; } }

  .kosong { text-align: center; margin-top: 9vh; padding: 0 12px; }
  .kosong h1 { font-size: 24px; font-weight: 600; color: #111b21; margin-bottom: 6px; }
  .kosong p { color: #54656f; margin: 0 0 22px; font-size: 14.5px; }
  .saran { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .saran button { border: none; background: #fff; border-radius: 999px; box-shadow: 0 1px 2px rgba(0,0,0,.18);
                  padding: 9px 15px; font-size: 14px; color: #075e54; font-weight: 500; cursor: pointer; }
  .saran button:active { background: #e9edef; }

  /* ===== bar kirim ala WhatsApp ===== */
  footer { background: #f0ebe5; padding: 6px 8px 8px; }
  .bungkus { max-width: 860px; margin: 0 auto; display: flex; align-items: flex-end; gap: 6px; }
  .kotak { flex: 1; display: flex; align-items: flex-end; background: #fff; border-radius: 24px;
           padding: 6px 6px 6px 16px; box-shadow: 0 1px 2px rgba(0,0,0,.12); }
  .kotak textarea { flex: 1; border: none; outline: none; resize: none; font: inherit; font-size: 15px;
                    max-height: 120px; padding: 7px 0; background: transparent; color: #111b21; }
  #kirim { flex: none; width: 48px; height: 48px; border: none; border-radius: 50%; background: #00a884;
           color: #fff; font-size: 20px; cursor: pointer; box-shadow: 0 1px 3px rgba(0,0,0,.3);
           display: flex; align-items: center; justify-content: center; padding-left: 3px; }
  #kirim:disabled { background: #a8a8a8; cursor: default; box-shadow: none; }
</style>
</head>
<body>

<header>
  <div class="ava-profil">T</div>
  <div class="siapa">
    <div class="nama">Tasirin (AI)</div>
    <div class="status" id="status">online</div>
  </div>
  <button id="baru" title="Mulai obrolan baru di peramban ini">⋮</button>
</header>

<main id="layar">
  <div class="kolom" id="kolom"></div>
</main>

<footer>
  <div class="bungkus">
    <div class="kotak">
      <textarea id="pesan" rows="1" placeholder="Ketik pesan" maxlength="2000"></textarea>
    </div>
    <button id="kirim" title="Kirim" disabled>➤</button>
  </div>
</footer>

<script>
const kolom = document.getElementById("kolom");
const layar = document.getElementById("layar");
const kotakPesan = document.getElementById("pesan");
const tombolKirim = document.getElementById("kirim");
const statusEl = document.getElementById("status");

const el = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// daftar id utas milik pengunjung ini (tersimpan di peramban saja)
let ids = [];
try { ids = JSON.parse(localStorage.getItem("bridge_ids") || "[]"); } catch (e) { ids = []; }
const lama = localStorage.getItem("bridge_utas");
if (lama && !ids.includes(lama)) { ids.push(lama); simpanIds(); }
function simpanIds() { localStorage.setItem("bridge_ids", JSON.stringify(ids)); }

const utasCache = {};   // id -> data utas terakhir dari server

const SARAN = [
  "kamu siapa sih?",
  "gimana pandanganmu soal desentralisasi?",
  "kenapa kejujuran nomor satu buatmu?",
  "gimana cara belajar ai menurutmu?"
];

const INFO = "🔒 yang jawab ai kloningan tasirin, dibentuk dari cara berpikir dan tulisannya — bukan tasirin yang asli, dan jawabannya bisa salah. ip sama perangkat kamu dicatat biar ai-nya kenal kamu; yang bisa lihat cuma tasirin sama ai-nya.";

function jam(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d)) return "";
  return d.toLocaleTimeString("id-ID", {hour: "2-digit", minute: "2-digit"}).replace(":", ".");
}
function labelTanggal(iso) {
  if (!iso) return "";
  const d = new Date(iso); if (isNaN(d)) return "";
  const kini = new Date();
  const samaHari = (a, b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
  if (samaHari(d, kini)) return "Hari ini";
  const kemarin = new Date(kini); kemarin.setDate(kini.getDate() - 1);
  if (samaHari(d, kemarin)) return "Kemarin";
  return d.toLocaleDateString("id-ID", {day: "numeric", month: "long", year: "numeric"});
}
function kunciHari(iso) {
  if (!iso) return "";
  const d = new Date(iso); if (isNaN(d)) return "";
  return d.getFullYear() + "-" + d.getMonth() + "-" + d.getDate();
}

function gambar() {
  let html = `<div class="info">${el(INFO)}</div>`;
  if (!ids.length) {
    html += `<div class="kosong">
      <h1>halo, mau nanya apa?</h1>
      <p>yang jawab ai kloningan tasirin. tanya aja kayak ngobrol biasa.</p>
      <div class="saran">${SARAN.map(s => `<button data-saran="${el(s)}">${el(s)}</button>`).join("")}</div>
    </div>`;
    kolom.innerHTML = html;
    kolom.querySelectorAll("[data-saran]").forEach(b =>
      b.addEventListener("click", () => { kotakPesan.value = b.dataset.saran; kirim(); }));
    statusEl.textContent = "online";
    return;
  }
  let hariTerakhir = "";
  let menunggu = false;
  for (const id of ids) {
    const u = utasCache[id];
    if (!u) continue;
    const kh = kunciHari(u.waktu);
    if (kh && kh !== hariTerakhir) {
      hariTerakhir = kh;
      html += `<div class="tanggal">${el(labelTanggal(u.waktu))}</div>`;
    }
    const centang = `<span class="centang${u.dibaca ? " baca" : ""}">✓✓</span>`;
    html += `<div class="baris kanan"><div class="gelembung">${el(u.isi)}<span class="meta">${jam(u.waktu)} ${centang}</span></div></div>`;
    if (u.balasan && u.balasan.length) {
      for (const b of u.balasan) {
        html += `<div class="baris kiri"><div class="gelembung">${el(b.isi)}<span class="meta">${jam(b.waktu)}</span></div></div>`;
      }
    } else if (u.dibaca) {
      // "mengetik" hanya sesudah pesan dibaca (centang biru) — seperti
      // WhatsApp beneran: dibaca dulu, baru kelihatan mengetik.
      menunggu = true;
      html += `<div class="baris kiri"><div class="gelembung mengetik"><span></span><span></span><span></span></div></div>`;
    }
  }
  kolom.innerHTML = html;
  statusEl.textContent = menunggu ? "mengetik…" : "online";
  layar.scrollTop = layar.scrollHeight;
}

async function segarkan() {
  for (const id of ids) {
    try {
      const r = await fetch("/api/utas/" + id);
      if (r.ok) utasCache[id] = await r.json();
    } catch (e) { /* jaringan putus sesaat, coba lagi nanti */ }
  }
  gambar();
}

async function kirim() {
  const isi = kotakPesan.value.trim();
  if (!isi) return;
  kotakPesan.value = "";
  aturTombol();
  try {
    const r = await fetch("/api/pesan", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({dari: "", isi, konteks: ids.slice(-6)})
    });
    const d = await r.json();
    if (d.id) {
      ids.push(d.id);
      simpanIds();
      utasCache[d.id] = {id: d.id, isi, waktu: new Date().toISOString(), dibaca: false, balasan: []};
      gambar();
      segarkan();
    }
  } catch (e) { /* server tak terjangkau */ }
}

function aturTombol() {
  tombolKirim.disabled = !kotakPesan.value.trim();
  kotakPesan.style.height = "auto";
  kotakPesan.style.height = Math.min(kotakPesan.scrollHeight, 120) + "px";
}

kotakPesan.addEventListener("input", aturTombol);
kotakPesan.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); kirim(); }
});
tombolKirim.addEventListener("click", kirim);
document.getElementById("baru").addEventListener("click", () => {
  if (!confirm("Mulai obrolan baru? Riwayat obrolan di peramban ini akan dibersihkan.")) return;
  ids = []; simpanIds();
  for (const k of Object.keys(utasCache)) delete utasCache[k];
  gambar();
});

gambar();
segarkan();
setInterval(segarkan, 3000);
</script>

</body>
</html>
